<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>スタッフ用・特典の使用確認</title><script defer src="config.js"></script><script defer src="service.js"></script><script defer src="staff.js"></script><style>body{font:17px system-ui;background:#fff9ed;color:#222;max-width:540px;margin:30px auto;padding:20px}input,button{box-sizing:border-box;width:100%;font:inherit;padding:14px;margin:8px 0 20px}button{background:#981c16;color:#fff;border:0;border-radius:8px}button:disabled{opacity:.5}#result{white-space:pre-line;font-weight:bold;padding:20px;background:white}label{display:block}small{line-height:1.8}</style></head><body><h1>特典の使用確認</h1><p>たまゆら くみやま野村店・スタッフ専用</p><small>お店の端末で操作してください。お客様の端末に合言葉を入力しないでください。</small><form id="check"><label for="token">お客様の券番号</label><input id="token" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="32"><button id="check-button">券の内容を確認</button></form><p id="result" role="status">券番号を入力してください。</p><form id="redeem" hidden><label for="secret">スタッフ用の合言葉</label><input id="secret" type="password" autocomplete="off" required minlength="12" maxlength="128"><button id="redeem-button">この特典を使用済みにする</button></form><p>「使用済みにしました」と表示された場合のみ適用してください。通信エラーの場合は、再度券の状態を確認してください。</p></body></html>
